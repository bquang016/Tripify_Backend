# ===================================================================
# APPLICATION CONFIGURATION
# Mapped to .env provided by user
# ===================================================================

spring.application.name=smart-booking-system
server.port=8386

# --- DATABASE (Supabase PostgreSQL) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- SECURITY & JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# --- EMAIL (Gmail SMTP) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# --- CLOUDFLARE R2 STORAGE ---
r2.accessKeyId=${R2_ACCESS_KEY}
r2.secretKey=${R2_SECRET_KEY}
r2.bucket=${R2_BUCKET}
r2.endpoint=${R2_ENDPOINT}
r2.publicDomain=${R2_PUBLIC_DOMAIN}

# --- GOOGLE AI GEMINI ---
gemini.api.key=${GEMINI_KEY}
gemini.api.url=${GEMINI_URL}

# --- OAUTH2 SOCIAL LOGIN ---
# Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# Facebook
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/facebook

# --- FILE UPLOAD LIMIT ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- APP CONSTANTS ---
app.frontend.url=http://localhost:5173

# --- FILE UPLOAD CONFIG ---
file.upload-dir=./uploads
file.static-path-pattern=/images/**
file.static-url-prefix=/images

# --- N8N Webhook ---
n8n.webhook.url=http://localhost:5678/webhook-test/tripify-chat
ai.internal.secret=${N8N_SECRET}
# --- STRIPE ---
stripe.api.key=${STRIPE_API_KEY}
stripe.public.key=${STRIPE_PUBLIC_KEY}
stripe.webhook.secret=whsec_44c8e5a310875f8ecbfae35d11ff08e286e28dd96bbe586e223830e0532c4a23

# VNPAY CONFIGURATION
vnpay.tmnCode=${VNPAY_TMN_CODE}
vnpay.hashSecret=${VNPAY_HASH_SECRET}
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:5173/payment/vnpay-return

# ACTUATOR & PROMETHEUS METRICS
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true